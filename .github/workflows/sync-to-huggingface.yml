name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a Hugging Face write token as the HF_TOKEN repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v6

      - name: Sync app to Hugging Face
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID || 'drhammed/summarization_tool' }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          include: |
            README.md
            index.html
